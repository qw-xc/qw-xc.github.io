<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>моё портфолио</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #808080;
            background-image:
                linear-gradient(45deg, #666 25%, transparent 25%),
                linear-gradient(-45deg, #666 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #666 75%),
                linear-gradient(-45deg, transparent 75%, #666 75%);
            background-size: 60px 60px;
            background-position: 0 0, 0 30px, 30px -30px, -30px 0px;
        }

        .container {
            background: rgba(30, 30, 30, 0.85);
            border-radius: 24px;
            padding: 30px;
            max-width: 700px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            background: linear-gradient(180deg, #e8e8e8 0%, #b0b0b0 100%);
            border-radius: 16px;
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
            color: #1a1a1a;
            font-weight: 700;
        }

        .header a {
            font-size: 18px;
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
        }

        .header a:hover {
            text-decoration: underline;
        }

        .card-row {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .card-row.reverse {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 120px;
            height: 120px;
            min-width: 120px;
            background: linear-gradient(180deg, #e8e8e8 0%, #b0b0b0 100%);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .text-card {
            background: linear-gradient(180deg, #e8e8e8 0%, #b0b0b0 100%);
            border-radius: 16px;
            padding: 18px 22px;
            flex: 1;
        }

        .text-card p {
            color: #1a1a1a;
            font-size: 14px;
            line-height: 1.6;
        }

        .text-card .highlight {
            font-weight: 700;
            color: #0a0a0a;
        }

        .stat-badge {
            display: inline-block;
            background: #2d2d2d;
            color: #4caf50;
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .card-row, .card-row.reverse {
                flex-direction: column;
            }
            .avatar {
                width: 100px;
                height: 100px;
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- Шапка -->
        <div class="header">
            <h1>твойник</h1>
            <a href="#works">проекты</a>
        </div>

        <!-- О себе -->
        <div class="card-row">
            <div class="avatar">
                <!-- Замени на свою аватарку -->
                <img src="https://via.placeholder.com/120" alt="avatar">
            </div>
            <div class="text-card">
                <p>
                    привет, я начинающий разработчик игр.
                    увлекаюсь геймдевом, дизайном и музыкой.
                    <br><br>
